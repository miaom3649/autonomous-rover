slam_toolbox:
  ros__parameters:
    # Mode: online_async builds the map while driving
    mode: mapping

    # Topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Use the odometry from ORB-SLAM3 (via slam_pose_bridge)
    use_pose_extrapolator: false

    # Map resolution and update rate (Pi 4 tuned)
    resolution: 0.05
    max_laser_range: 4.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.1
    map_update_interval: 2.0

    # Disable loop closure to save CPU on Pi 4
    do_loop_closing: false

    # Serialization (for map saving)
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
