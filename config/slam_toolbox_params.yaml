slam_toolbox:
  ros__parameters:
    # Mode: online_async builds the map while driving
    mode: mapping

    # Topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # No wheel encoders on this rover — odom_frame -> base_frame now comes from
    # rf2o_laser_odometry (pure lidar scan-to-scan odometry, see nav.launch.py)
    # instead of the old static-identity placeholder, giving slam_toolbox a
    # real (if imperfect — it drifts like any odometry) motion prior to narrow
    # its own scan-matching search around, rather than searching blind.
    use_scan_matching: true

    # Kept at 0 so slam_toolbox still processes every incoming scan rather
    # than gating on rf2o's own movement estimate, which has no independent
    # way to detect wheel slip / mismatches of its own to be gated on.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0

    # Map resolution and update rate (Pi 4 tuned)
    resolution: 0.05
    max_laser_range: 4.0
    map_update_interval: 1.0

    # Corrects the drift that builds up from having no wheel odometry (see
    # use_scan_matching above) by re-aligning the map when the rover revisits
    # a place — costs more CPU on the Pi 4, worth watching for lag.
    do_loop_closing: true

    # Serialization (for map saving)
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
