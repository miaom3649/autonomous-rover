slam_toolbox:
  ros__parameters:
    # Mode: online_async builds the map while driving
    mode: mapping

    # Topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # No wheel odometry on this rover and vision-based (ORB-SLAM3) localization
    # has been retired — odom_frame is published as a static identity onto
    # base_link (see nav.launch.py), so slam_toolbox gets no external motion
    # prior at all and relies entirely on scan-to-scan / scan-to-map matching.
    use_scan_matching: true

    # slam_toolbox normally only processes a new scan once odometry reports
    # the robot has moved at least this far/turned this much — since our
    # odom is a static identity (no wheel encoders), that delta is always
    # exactly zero and every scan would be skipped forever, freezing the
    # published pose at the origin. Zeroing these thresholds makes it
    # process every incoming scan regardless of what odom (doesn't) say.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0

    # Map resolution and update rate (Pi 4 tuned)
    resolution: 0.05
    max_laser_range: 4.0
    map_update_interval: 1.0

    # Corrects the drift that builds up from having no wheel odometry (see
    # use_scan_matching above) by re-aligning the map when the rover revisits
    # a place — costs more CPU on the Pi 4, worth watching for lag.
    do_loop_closing: true

    # Serialization (for map saving)
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
