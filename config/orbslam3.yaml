%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera — PinHole, calibrated at 640x480 and scaled ×0.5 to 320x240
# RMS reprojection error: 0.7344 px
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

Camera.fx: 321.03098008641035
Camera.fy: 320.5022483982298
Camera.cx: 156.38881537724336
Camera.cy: 116.02029997042648

Camera.k1:  0.34740589756056456
Camera.k2: -2.328076843275508
Camera.p1: -0.006620102436670903
Camera.p2: -0.0031368694154414716

Camera.width:  320
Camera.height: 240
Camera.fps:    15
Camera.RGB:    1

#--------------------------------------------------------------------------------------------
# ORB extractor — reduced feature count for Pi 4 CPU budget
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures:   500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels:     8
ORBextractor.iniThFAST:   20
ORBextractor.minThFAST:   7
